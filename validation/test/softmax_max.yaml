# Q8 logits to Q15 probabilities: max phase.
array_config:
  columns: 4
  rows: 4
  compiled_ii: 8
  cores:
    - column: 0
      row: 0
      core_id: "0"
      entries:
        - entry_id: entry0
          instructions:
            - index_per_ii: 0
              operations:
                - opcode: PHI_CONST
                  id: 0
                  time_step: 0
                  invalid_iterations: 0
                  src_operands: [{operand: "$3", color: RED}, {operand: "arg0", color: RED}]
                  dst_operands: [{operand: "$0", color: RED}, {operand: "$25", color: RED}]
            - index_per_ii: 1
              operations:
                - opcode: LOAD
                  id: 1
                  time_step: 1
                  invalid_iterations: 0
                  src_operands: [{operand: "$0", color: RED}]
                  dst_operands: [{operand: "$0", color: RED}, {operand: "$16", color: RED}]
            - index_per_ii: 2
              operations:
                - opcode: PHI_CONST
                  id: 2
                  time_step: 2
                  invalid_iterations: 0
                  src_operands: [{operand: "$1", color: RED}, {operand: "#2147483648", color: RED}]
                  dst_operands: [{operand: "$8", color: RED}, {operand: "$24", color: RED}]
            - index_per_ii: 3
              operations:
                - opcode: ICMP_SLT
                  id: 3
                  time_step: 3
                  invalid_iterations: 0
                  src_operands: [{operand: "$8", color: RED}, {operand: "$0", color: RED}]
                  dst_operands: [{operand: "$0", color: RED}]
            - index_per_ii: 4
              operations:
                - opcode: SEL
                  id: 4
                  time_step: 4
                  invalid_iterations: 0
                  src_operands: [{operand: "$0", color: RED}, {operand: "$16", color: RED}, {operand: "$24", color: RED}]
                  dst_operands: [{operand: "$1", color: RED}, {operand: "$8", color: RED}]
            - index_per_ii: 5
              operations:
                - opcode: PHI_CONST
                  id: 5
                  time_step: 5
                  invalid_iterations: 0
                  src_operands: [{operand: "$17", color: RED}, {operand: "arg1", color: RED}]
                  dst_operands: [{operand: "$0", color: RED}, {operand: "$17", color: RED}]
            - index_per_ii: 6
              operations:
                - opcode: STORE
                  id: 6
                  time_step: 6
                  invalid_iterations: 0
                  src_operands: [{operand: "$8", color: RED}, {operand: "$0", color: RED}]
                  dst_operands: []
            - index_per_ii: 7
              operations:
                - opcode: ADD
                  id: 7
                  time_step: 7
                  invalid_iterations: 0
                  src_operands: [{operand: "$25", color: RED}, {operand: "#1", color: RED}]
                  dst_operands: [{operand: "$3", color: RED}]
